<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Foundations - Laptop Rescue</title>
  <style>
:root{color-scheme:dark;--navy:#0f2b4a;--ink:#081b30;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--gold:#f59e0b;--gold2:#fbbf24;--white:#fff;--muted:#c8d7e8;--good:#22c55e;--bad:#ef4444;--blue:#60a5fa}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#07182a,var(--navy));color:var(--white)}
button{font:inherit}.activity{width:min(100%,980px);min-height:620px;margin:0 auto;padding:18px}.topbar{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:13px}.eyebrow{color:var(--gold2);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}h1{margin:4px 0 0;font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:0}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 12px;font-weight:800;white-space:nowrap}
.layout{display:grid;grid-template-columns:250px 1fr;gap:16px;padding-top:16px}.visual,.board{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px}.visual{display:grid;align-content:center;justify-items:center;text-align:center;min-height:430px}.board{min-height:430px}.scene{width:min(100%,210px);aspect-ratio:1/.8;display:grid;place-items:center}.scene svg{width:100%;height:100%}.scene-title{font-size:20px;font-weight:900;margin:12px 0 4px}.scene-note{color:var(--muted);line-height:1.45;margin:0}.prompt{border:1px solid rgba(245,158,11,.42);background:rgba(8,27,48,.72);border-radius:8px;padding:16px;margin-bottom:14px}.prompt .label{color:var(--gold2);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.prompt .text{font-size:clamp(21px,3.2vw,31px);font-weight:900;line-height:1.1;margin-top:6px;overflow-wrap:anywhere}.small{color:var(--muted);line-height:1.45}.row{display:grid;gap:10px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.threecol{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card,.zone,.choice,.match-card{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.1);color:var(--white);padding:13px;min-height:56px;line-height:1.25}.card{cursor:grab}.card:active{cursor:grabbing}.choice,.match-card{cursor:pointer;text-align:left}.choice:hover,.choice:focus-visible,.match-card:hover,.match-card:focus-visible,.card:focus-visible{outline:2px solid transparent;border-color:var(--gold);background:rgba(245,158,11,.16)}.zone{min-height:150px;display:grid;align-content:center;justify-items:center;text-align:center;gap:8px;border-style:dashed}.zone strong{font-size:22px}.zone.goodzone{border-color:rgba(34,197,94,.75)}.zone.badzone{border-color:rgba(239,68,68,.75)}.zone.dragover{background:rgba(245,158,11,.18);border-color:var(--gold)}.drop-target{min-height:170px;border:2px dashed rgba(245,158,11,.65);border-radius:8px;display:grid;place-items:center;text-align:center;padding:18px;background:rgba(245,158,11,.08);margin:12px 0}.drop-target.dragover{background:rgba(245,158,11,.2)}
.feedback{margin-top:14px;border:1px solid var(--line);border-radius:8px;min-height:74px;padding:13px;background:rgba(0,0,0,.16);color:var(--muted);line-height:1.45}.feedback strong{color:var(--white)}.controls{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.primary{border:0;border-radius:8px;background:var(--gold);color:#211400;padding:12px 16px;min-height:45px;font-weight:900;cursor:pointer}.primary:hover,.primary:focus-visible{background:var(--gold2)}.ghost{border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--white);border-radius:8px;padding:11px 14px;cursor:pointer}.correct{border-color:var(--good)!important;background:rgba(34,197,94,.18)!important}.wrong{border-color:var(--bad)!important;background:rgba(239,68,68,.18)!important}.selected{border-color:var(--gold)!important;background:rgba(245,158,11,.2)!important}.locked{opacity:.55;pointer-events:none}.email{background:#f8fafc;color:#142033;border-radius:8px;padding:14px;border-left:6px solid var(--gold);box-shadow:0 16px 36px rgba(0,0,0,.25)}.email div{margin-bottom:7px}.email strong{color:#0f2b4a}.swipe-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.swipe-left{background:rgba(239,68,68,.16)}.swipe-right{background:rgba(34,197,94,.16)}.keycap{display:inline-block;border:1px solid rgba(255,255,255,.36);border-bottom-width:3px;border-radius:6px;padding:5px 8px;margin:1px;background:rgba(255,255,255,.14);font-weight:900}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match-card.done{opacity:.55}.end{min-height:390px;display:grid;align-content:center;justify-items:start;gap:12px}.end h2{font-size:clamp(38px,7vw,68px);line-height:1;margin:0}.summary{display:grid;gap:8px;width:100%}.summary div{border-left:4px solid var(--gold);background:rgba(255,255,255,.08);border-radius:0 8px 8px 0;padding:10px 12px;color:var(--muted)}.rank-list{display:grid;gap:8px}.rank-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.rank-item button{min-width:42px}.mini{font-size:13px;color:var(--muted)}
@media (max-width:760px){.activity{padding:12px}.topbar,.layout{grid-template-columns:1fr}.stats{justify-content:flex-start}.visual{min-height:auto}.board{min-height:420px}.scene{width:170px}.twocol,.threecol,.match-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <main class="activity">
    <header class="topbar">
      <div><div class="eyebrow">Module 0 - Laptop Basics & Care</div><h1>Laptop Rescue</h1></div>
      <div class="stats"><div class="pill">Progress <span id="progress">1 / 1</span></div><div class="pill">Score <span id="score">0</span></div></div>
    </header>
    <section class="layout">
      <aside class="visual"><div class="scene"><svg viewBox="0 0 300 230"><rect x="48" y="28" width="204" height="132" rx="12" fill="#153b63" stroke="#f59e0b" stroke-width="5"/><rect x="68" y="50" width="164" height="88" rx="5" fill="#e7f0fb"/><path d="M30 172h240l20 34H10z" fill="#c8d7e8"/><circle cx="150" cy="94" r="28" fill="#f59e0b"/><path d="M138 88c4-7 20-7 24 0M135 106h30" fill="none" stroke="#0f2b4a" stroke-width="6" stroke-linecap="round"/></svg></div><div class="scene-title">Sick Laptop</div><p class="scene-note">Drag the right fix onto the laptop.</p></aside>
      <section class="board"><div id="board"></div><div id="feedback" class="feedback" aria-live="polite"></div></section>
    </section>
  </main>
  <script>
const game = {"module": "Module 0 - Laptop Basics & Care", "mechanic": "Diagnose & Fix", "mode": "dropfix", "help": "Drag a fix card onto the laptop, or click the card.", "end": "You diagnosed common laptop problems and practised good care habits.", "items": [{"prompt": "My laptop is really slow.", "answer": "Restart it properly", "decoys": ["Close the lid", "Open more apps"], "feedback": "A restart clears stuck processes and resets uptime."}, {"prompt": "An app has frozen and will not close.", "answer": "Use Task Manager or Force Quit", "decoys": ["Keep clicking it", "Delete random files"], "feedback": "`Ctrl + Shift + Esc` or `Cmd + Option + Esc` helps close a frozen app."}, {"prompt": "My battery dies really fast.", "answer": "Check uptime and restart", "decoys": ["Only close the lid", "Ignore it"], "feedback": "Long uptime can affect performance and battery life."}, {"prompt": "I dropped my laptop and it cracked.", "answer": "Report it to IT or parents", "decoys": ["Hide it", "Tape it and keep going"], "feedback": "Damage should be reported early before it gets worse."}, {"prompt": "My laptop will not connect to WiFi.", "answer": "Restart the laptop first", "decoys": ["Change random settings", "Share your password"], "feedback": "Restarting is a safe first fix before asking IT Helpdesk."}, {"prompt": "I spilled water on it.", "answer": "Turn it off and get help", "decoys": ["Keep using it", "Shake it while on"], "feedback": "Turn it off immediately and do not try to fix liquid damage yourself."}]};
let deck=[], index=0, score=0, misses=[], locked=false, selected=null, matched=0, dragging=null, rankOrder=[];
const $=s=>document.querySelector(s), board=$("#board"), feedback=$("#feedback"), progress=$("#progress"), scoreEl=$("#score");
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function fmt(v){return esc(v).replace(/`([^`]+)`/g,'<span class="keycap">$1</span>')}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function setStats(){const total=game.mode==="match"?game.pairs.length:deck.length;progress.textContent=`${Math.min(index+1,total)} / ${total}`;scoreEl.textContent=score}
function start(){deck=shuffle(game.items||[]);index=0;score=0;misses=[];selected=null;matched=0;locked=false;rankOrder=[];feedback.innerHTML=game.help||"Complete each challenge."; if(game.mode==="match") renderMatch(); else if(game.mode==="rank") renderRank(); else renderStep()}
function prompt(label,text,sub=""){return `<div class="prompt"><div class="label">${esc(label)}</div><div class="text">${fmt(text)}</div>${sub?`<div class="small">${fmt(sub)}</div>`:""}</div>`}
function current(){return deck[index]}
function nextButton(){return `<div class="controls"><button class="primary" id="next">${index===deck.length-1?"Finish":"Next"}</button></div>`}
function finishButton(){return `<div class="controls"><button class="primary" id="finish">Finish</button></div>`}
function bindNext(){const n=$("#next"); if(n)n.onclick=()=>{index++; index>=deck.length?end():renderStep()}}
function judge(ok,item,extra=""){if(locked)return;locked=true;if(ok){score++;feedback.innerHTML=`<strong>Correct.</strong> ${fmt(item.feedback||extra)}`}else{misses.push(item);feedback.innerHTML=`<strong>Not quite.</strong> ${fmt(item.feedback||extra)}`}setStats()}
function renderStep(){locked=false;window.onkeydown=null;setStats();const item=current(); if(game.mode==="dropfix") return renderDropFix(item); if(game.mode==="sort") return renderSort(item); if(game.mode==="swipe") return renderSwipe(item); if(game.mode==="key") return renderKey(item); renderChoice(item)}
function renderDropFix(item){const choices=shuffle([item.answer,...item.decoys]);board.innerHTML=prompt(game.mechanic,item.prompt,item.sub)+`<div class="drop-target" id="target"><strong>Drop the best fix here</strong><span class="small">or click a fix card</span></div><div class="threecol">${choices.map(c=>`<button class="card" draggable="true" data-value="${esc(c)}">${fmt(c)}</button>`).join("")}</div><div id="after"></div>`;bindCards(v=>handleDropAnswer(v,item));bindTarget(v=>handleDropAnswer(v,item))}
function handleDropAnswer(value,item){judge(value===item.answer,item);document.querySelectorAll(".card").forEach(c=>{c.classList.toggle("correct",c.dataset.value===item.answer);c.classList.toggle("wrong",c.dataset.value===value&&value!==item.answer);c.classList.add("locked")});$("#after").innerHTML=nextButton();bindNext()}
function renderSort(item){board.innerHTML=prompt(game.mechanic,item.text,item.sub)+`<div class="twocol">${game.zones.map(z=>`<div class="zone ${z.kind||""}" data-zone="${esc(z.id)}"><strong>${esc(z.label)}</strong><span class="small">${esc(z.hint||"Drop here")}</span></div>`).join("")}</div><div class="controls">${game.zones.map(z=>`<button class="ghost" data-pick="${esc(z.id)}">${esc(z.label)}</button>`).join("")}</div><div id="after"></div>`;document.querySelectorAll(".zone").forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add("dragover")};z.ondragleave=()=>z.classList.remove("dragover");z.ondrop=e=>{e.preventDefault();z.classList.remove("dragover");handleSort(z.dataset.zone,item)}});document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>handleSort(b.dataset.pick,item));const p=$(".prompt");p.draggable=true;p.classList.add("card");p.ondragstart=()=>dragging=item.text}
function handleSort(zone,item){judge(zone===item.zone,item);document.querySelectorAll(".zone").forEach(z=>z.classList.toggle(zone===item.zone?"correct":"wrong",z.dataset.zone===zone));$("#after").innerHTML=nextButton();bindNext()}
function renderSwipe(item){board.innerHTML=prompt(game.mechanic,"Inspect this email, then sort it.")+`<div class="email" id="emailCard" draggable="true"><div><strong>From:</strong> ${esc(item.from)}</div><div><strong>Subject:</strong> ${esc(item.subject)}</div><div>${esc(item.preview)}</div><span class="small">${esc(item.tag||"")}</span></div><div class="swipe-actions"><button class="choice swipe-left" data-swipe="suspicious">Suspicious</button><button class="choice swipe-right" data-swipe="legit">Legit</button></div><div id="after"></div>`;document.querySelectorAll("[data-swipe]").forEach(b=>b.onclick=()=>handleSwipe(b.dataset.swipe,item));let startX=0;const card=$("#emailCard");card.ondragstart=e=>{startX=e.clientX};card.ondragend=e=>{const dx=e.clientX-startX;if(Math.abs(dx)>70)handleSwipe(dx<0?"suspicious":"legit",item)}}
function handleSwipe(v,item){judge(v===item.answer,item);document.querySelectorAll("[data-swipe]").forEach(b=>b.classList.toggle(b.dataset.swipe===item.answer?"correct":"wrong",b.dataset.swipe===v));$("#after").innerHTML=nextButton();bindNext()}
function renderKey(item){if(item.type==="habit")return renderSort(item);board.innerHTML=prompt("Key press challenge",item.prompt,"Press the shortcut on your keyboard, or use the backup button.")+`<div class="drop-target"><strong>${fmt(item.display)}</strong><span class="small">Waiting for keys...</span></div><div class="controls"><button class="ghost" id="backup">I know this shortcut</button></div><div id="after"></div>`;window.onkeydown=e=>{if(locked)return;const got=combo(e);if(got===item.combo){judge(true,item);$("#after").innerHTML=nextButton();bindNext()}};$("#backup").onclick=()=>{judge(true,item);$("#after").innerHTML=nextButton();bindNext()}}
function combo(e){let keys=[];if(e.ctrlKey)keys.push("ctrl");if(e.metaKey)keys.push("meta");if(e.shiftKey)keys.push("shift");if(e.altKey)keys.push("alt");const k=e.key.toLowerCase();if(!["control","shift","alt","meta"].includes(k))keys.push(k);return keys.join("+")}
function renderChoice(item){const choices=shuffle([item.answer,...item.decoys]);board.innerHTML=prompt(game.mechanic,item.prompt,item.sub)+`<div class="row">${choices.map(c=>`<button class="choice" data-value="${esc(c)}">${fmt(c)}</button>`).join("")}</div><div id="after"></div>`;document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{judge(b.dataset.value===item.answer,item);document.querySelectorAll(".choice").forEach(c=>{c.classList.toggle("correct",c.dataset.value===item.answer);c.classList.toggle("wrong",c.dataset.value===b.dataset.value&&b.dataset.value!==item.answer);c.disabled=true});$("#after").innerHTML=nextButton();bindNext()})}
function renderMatch(){setStats();const pairs=shuffle(game.pairs).map((p,i)=>({...p,id:i,done:false}));const left=shuffle(pairs),right=shuffle(pairs);board.innerHTML=prompt(game.mechanic,"Connect each app to its best task.","Click an app, then click its matching task.")+`<div class="match-grid"><div class="row">${left.map(p=>`<button class="match-card" data-side="left" data-id="${p.id}"><strong>${esc(p.left)}</strong></button>`).join("")}</div><div class="row">${right.map(p=>`<button class="match-card" data-side="right" data-id="${p.id}">${esc(p.right)}</button>`).join("")}</div></div>`;document.querySelectorAll(".match-card").forEach(b=>b.onclick=()=>{if(b.classList.contains("done"))return;if(!selected){selected=b;b.classList.add("selected");return}if(selected.dataset.side===b.dataset.side){selected.classList.remove("selected");selected=b;b.classList.add("selected");return}const ok=selected.dataset.id===b.dataset.id;if(ok){score++;matched++;feedback.innerHTML="<strong>Matched.</strong> That app fits the task.";selected.classList.add("done","correct");b.classList.add("done","correct");selected=null;if(matched===game.pairs.length)setTimeout(end,500)}else{misses.push({prompt:selected.textContent,feedback:"Review which Microsoft 365 app best fits each task."});feedback.innerHTML="<strong>Not quite.</strong> Try another connection.";selected.classList.add("wrong");b.classList.add("wrong");setTimeout(()=>{selected?.classList.remove("selected","wrong");b.classList.remove("wrong");selected=null},600)}setStats()})}
function renderRank(){rankOrder=[...game.items];drawRank();feedback.innerHTML="Move the passwords until weakest is at the top and strongest is at the bottom."}
function drawRank(){setStats();board.innerHTML=prompt(game.mechanic,"Rank these passwords from weakest to strongest.")+`<div class="rank-list">${rankOrder.map((it,i)=>`<div class="card rank-item"><span class="mini">${i+1}</span><strong>${fmt(it.text)}</strong><span><button class="ghost" data-up="${i}">Up</button> <button class="ghost" data-down="${i}">Down</button></span></div>`).join("")}</div>${finishButton()}`;document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>move(Number(b.dataset.up),-1));document.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>move(Number(b.dataset.down),1));$("#finish").onclick=()=>{const ok=rankOrder.every((it,i)=>it.rank===i);score=ok?rankOrder.length:rankOrder.filter((it,i)=>it.rank===i).length;if(!ok)misses.push({feedback:"Strong passwords are longer, less predictable, and use a mix of character types."});end()}}
function move(i,d){const j=i+d;if(j<0||j>=rankOrder.length)return;[rankOrder[i],rankOrder[j]]=[rankOrder[j],rankOrder[i]];drawRank()}
function bindCards(cb){document.querySelectorAll(".card").forEach(c=>{c.onclick=()=>cb(c.dataset.value);c.ondragstart=()=>dragging=c.dataset.value})}
function bindTarget(cb){const t=$("#target");t.ondragover=e=>{e.preventDefault();t.classList.add("dragover")};t.ondragleave=()=>t.classList.remove("dragover");t.ondrop=e=>{e.preventDefault();t.classList.remove("dragover");cb(dragging)}}
function end(){window.onkeydown=null;progress.textContent=`${game.mode==="match"?game.pairs.length:deck.length} / ${game.mode==="match"?game.pairs.length:deck.length}`;const total=game.mode==="match"?game.pairs.length:game.mode==="rank"?game.items.length:deck.length;board.innerHTML=`<div class="end"><div class="eyebrow">${esc(game.module)}</div><h2>${score} / ${total}</h2><p class="small">${esc(game.end)}</p><div class="summary">${misses.length?misses.slice(0,4).map(m=>`<div>${fmt(m.feedback)}</div>`).join(""):"<div>Clean run. Every challenge was completed correctly.</div>"}</div><button class="primary" id="replay">Replay</button></div>`;feedback.innerHTML="Activity complete.";$("#replay").onclick=start}
start();
</script>
</body>
</html>
